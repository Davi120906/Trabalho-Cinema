version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-jdbc
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: DataBaseCinema
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jdbc_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - jdbc_network

networks:
  jdbc_network:

volumes:
  mysql_data:
